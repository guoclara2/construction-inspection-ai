# Isolated local test infrastructure. Never uses production databases or volumes.
name: inspection-readiness-tests
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: inspection-local-test-only
      POSTGRES_DB: inspection_test_pg
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inspection_test_pg"]
      interval: 3s
      timeout: 3s
      retries: 30
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: inspection-local-test-only
      MYSQL_DATABASE: inspection_test_mysql
    ports: ["127.0.0.1:13306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
