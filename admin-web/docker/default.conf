server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 22m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-WX-Source "";
        proxy_set_header X-WX-Openid "";
        proxy_set_header X-WX-Unionid "";
        proxy_set_header X-WX-Appid "";
    }
    location = /health { proxy_pass http://api:8000/health; }
    location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
}
