name: production-candidate
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql, mysql]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: inspection_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: inspection_test_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pci-only-password"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/*requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: SQLite migrations and tests
        if: matrix.database == 'sqlite'
        run: python scripts/verify.py --backend-only
      - name: PostgreSQL migrations and tests
        if: matrix.database == 'postgresql'
        env:
          INSPECTION_TEST_EXTERNAL: '1'
          INSPECTION_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/inspection_test_ci
        run: python scripts/verify.py --backend-only
      - name: MySQL migrations and tests
        if: matrix.database == 'mysql'
        env:
          INSPECTION_TEST_EXTERNAL: '1'
          INSPECTION_TEST_DATABASE_URL: mysql+pymysql://root:ci-only-password@localhost:3306/inspection_test_ci
        run: python scripts/verify.py --backend-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-${{ matrix.database }}
          path: .verification/
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci --prefix admin-web
      - run: python scripts/verify.py --clients-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clients
          path: .verification/
